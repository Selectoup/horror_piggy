<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>逃离老宅</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="world3d"></canvas>
      <canvas id="game"></canvas>

      <div class="dangerWash" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="scanline" aria-hidden="true"></div>
      <div id="crosshair" aria-hidden="true"></div>

      <section id="titleScreen" class="overlay overlayTitle is-active">
        <div class="titlePanel">
          <div class="titleCopy">
            <p class="kicker">老宅 427</p>
            <h1>逃离老宅</h1>
            <p class="intro">你从一间破旧卧室里醒来。找齐六条线索，利用撬棍、保险丝和发条诱饵，打开地下深处的钥匙柜，在那些东西第一次杀死你之前离开。</p>
          </div>
          <div class="caseBoard" aria-label="逃脱目标">
            <div>
              <span>线索</span>
              <strong>6 处</strong>
            </div>
            <div>
              <span>密码</span>
              <strong>未知</strong>
            </div>
            <div>
              <span>死亡</span>
              <strong>1 次</strong>
            </div>
          </div>
          <div class="difficultyPicker" aria-label="难度选择">
            <button class="difficultyButton is-selected" type="button" data-difficulty="easy">
              <span>简单模式</span>
              <strong>慢速巡逻</strong>
            </button>
            <button class="difficultyButton" type="button" data-difficulty="hard">
              <span>困难模式</span>
              <strong>更早追捕</strong>
            </button>
            <button class="difficultyButton" type="button" data-difficulty="nightmare">
              <span>恶梦模式</span>
              <strong>全员苏醒</strong>
            </button>
          </div>
          <button id="startButton" class="primaryButton" type="button">在卧室醒来</button>
        </div>
      </section>

      <section id="endScreen" class="overlay overlayEnd">
        <canvas id="deathCanvas" aria-hidden="true"></canvas>
        <div class="titlePanel endPanel">
          <p id="endKicker" class="kicker">结局</p>
          <h2 id="endTitle">你逃出去了</h2>
          <p id="endText" class="intro">前门在你身后合上，屋里的钟声停在凌晨三点。</p>
          <button id="restartButton" class="primaryButton" type="button">重新开始</button>
        </div>
      </section>

      <div id="hud" class="hud">
        <div class="hudGlass">
          <div class="hudHeader">
            <div>
              <span class="eyebrow">老宅档案</span>
              <strong>427</strong>
            </div>
            <div id="dangerBadge" class="dangerBadge">
              <span class="signalDot"></span>
              <span id="dangerState">远</span>
            </div>
          </div>

          <div class="meters">
            <div class="meterBlock">
              <div class="meterLabel">
                <span>线索</span>
                <strong id="clueCount">0 / 6</strong>
              </div>
              <div class="meterTrack">
                <div id="progressFill" class="meterFill clueFill"></div>
              </div>
            </div>
            <div class="meterBlock">
              <div class="meterLabel">
                <span>体力</span>
                <strong id="staminaText">100%</strong>
              </div>
              <div class="meterTrack">
                <div id="staminaFill" class="meterFill staminaFill"></div>
              </div>
            </div>
          </div>

          <div class="inventory">
            <div id="slotPhoto" class="slot" title="床头旧照片"><span></span></div>
            <div id="slotFridge" class="slot" title="发霉冰箱便签"><span></span></div>
            <div id="slotDiary" class="slot" title="摇椅下日记"><span></span></div>
            <div id="slotTape" class="slot tapeSlot" title="儿童房录音带"><span></span></div>
            <div id="slotGreenhouse" class="slot greenhouseSlot" title="温室血字"><span></span></div>
            <div id="slotLedger" class="slot ledgerSlot" title="停尸间账本"><span></span></div>
            <div id="slotCrowbar" class="slot toolSlot crowbarSlot" title="生锈撬棍"><span></span></div>
            <div id="slotFuse" class="slot toolSlot fuseSlot" title="蓝色保险丝"><span></span></div>
            <div id="slotMusicbox" class="slot toolSlot musicboxSlot" title="发条玩具诱饵"><span></span></div>
            <div id="slotTalisman" class="slot talismanSlot" title="裂纹护符"><span></span></div>
            <div id="slotKey" class="slot keySlot" title="前门钥匙"><span></span></div>
          </div>
        </div>

        <div id="task" class="task">寻找老宅里的发光线索。</div>
        <div id="message" class="message" role="status"></div>
      </div>

      <div class="statusRail">
        <span>钥匙</span>
        <strong id="keyState">未取得</strong>
        <span>武器</span>
        <strong id="weaponState">无</strong>
        <span>死亡</span>
        <strong id="deathState">0 / 1</strong>
      </div>

      <div id="hint" class="hint">调查</div>
      <div id="mobileControls" class="mobileControls" aria-label="移动控制">
        <button data-move="forward" aria-label="前进">↑</button>
        <div>
          <button data-move="left" aria-label="左移">←</button>
          <button data-move="back" aria-label="后退">↓</button>
          <button data-move="right" aria-label="右移">→</button>
        </div>
      </div>
      <button id="interactButton" class="interactButton" type="button">调查</button>
      <button id="fireButton" class="fireButton" type="button">开火</button>
    </div>
    <script src="src/vendor/three.min.js"></script>
    <script src="src/world3d.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
